<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            var s=1, toplam=0;
            do{
                document.write("döngü içindeki sayaç="+s);
                toplam=toplam+s;
                document.write(" döngü içindeki toplam="+toplam);
                s++;
                document.write("<br>");
            }while(s<=20);
            document.write("toplam="+toplam);
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>
 <head>
    <meta charset="utf-8">
 </head>   
 <body>
   <script>
    //sadece pozitif sayıların karesini alan program
    var sayi,kare;
    sayi=Number(prompt("sayı:"));

    //sorgu
    if(sayi<0)
   {
    alert("sayı negatif");
    alert ("f5 ile sayıyı yeniden çalıştır");
   }
   else 
   {
    kare=sayi*sayi
    alert("sayı:"+sayi+"karesi="+kare);
   }
   </script> 
 </body>
</html>

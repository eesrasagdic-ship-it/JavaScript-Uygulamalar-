<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //girilen iki değer arasındaki sayıların toplamı
            var x, y, toplam=0;

            x = Number(prompt("x:"));
            y = Number(prompt("y:"));

            while(x <= y){
                toplam = toplam + x;
                x++;
            }

            document.write("toplam=" + toplam);
        </script>
    </body>
</html>

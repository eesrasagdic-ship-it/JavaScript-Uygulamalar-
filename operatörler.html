<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //ARTIRMA VE AZALTMA OPERATÖRLERİ
            //a++
            var a =2
            document.write(a++); //ilk önce işlem yapılır sonra artırılır
            document.write("<br>");
            document.write(a);

            //++a ilk önce artırılır sonra işlem yapılır
            document.write(++a);
            document.write("<br>");
            document.write(a);

            //a-- ilk önce işlem sonra azaltma
            document.write(a--); 
            document.write("<br>");
            document.write(a);

            //--a ilk önce azaaltılacak sonra işlem yapılacak
            document.write(--a);
            document.write("<br>");
            document.write(a);

        </script>
    </body>
</html>
